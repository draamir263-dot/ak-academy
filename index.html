<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>AK Academy</title>

    <!-- Stop APK from caching old data -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      /* The Loading Screen Styles */
      #loading-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1e3a8a; /* Deep blue background */
        z-index: 99999;
        transition: opacity 0.5s ease;
      }
      #loading-screen img {
        width: 120px;
        height: 120px;
        border-radius: 20px;
        margin-bottom: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      #loading-screen h2 {
        color: white;
        font-family: sans-serif;
        font-size: 28px;
        font-weight: 800;
        margin: 0;
      }
      /* Arabic Dua Styling */
      #loading-screen .dua-arabic {
        color: #facc15; /* Yellow */
        font-family: 'Amiri', 'Traditional Arabic', serif;
        font-size: 22px;
        margin-top: 15px;
        direction: rtl;
        font-weight: bold;
      }
      #loading-screen .dua-english {
        color: #93c5fd; /* Light blue */
        font-family: sans-serif;
        font-style: italic;
        font-size: 13px;
        margin-top: 5px;
        text-align: center;
        max-width: 280px;
      }
      #loading-screen .quote {
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        margin-top: 20px;
        text-align: center;
        max-width: 250px;
        opacity: 0.8;
      }
      /* The moving circle */
      .spinner {
        margin-top: 30px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #facc15; /* Yellow spinner */
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- React App Mounts Here -->
    <div id="root"></div>

    <!-- The Loading Screen (Stays until React hides it) -->
    <div id="loading-screen">
      <img src="/logo.png" alt="AK Academy Logo" />
      <h2>AK Academy</h2>
      
      <!-- Ilm Ki Dua -->
      <div class="dua-arabic">رَبِّ زِدْنِي عِلْمًا</div>
      <div class="dua-english">"My Lord, increase me in knowledge."</div>
      
      <div class="quote">"Success is the sum of small efforts, repeated day in and day out."</div>
      <div class="spinner"></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
