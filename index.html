<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Title -->
    <title>AK Academy</title>

    <!-- Stop APK from caching old data -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root">
      <!-- LOADING SCREEN / SPLASH SCREEN -->
      <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1e3a8a; z-index: 9999;">
        <img src="/logo.png" alt="AK Academy Logo" style="width: 120px; height: 120px; margin-bottom: 20px; border-radius: 20px;" />
        <h2 style="color: white; font-family: sans-serif; font-size: 24px; font-weight: bold;">AK Academy</h2>
        <p style="color: #93c5fd; font-family: sans-serif; margin-top: 5px;">Make MDCAT on your fingertips.</p>
        <div style="margin-top: 30px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
